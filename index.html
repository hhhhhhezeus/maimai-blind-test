<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦麦盲测局</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202233;background:#f5f2ec}*{box-sizing:border-box}body{margin:0}header{background:#202438;color:white;padding:30px max(6vw,24px)}header small{color:#bfc8f0;letter-spacing:.18em}h1{font-size:clamp(26px,5vw,45px);margin:8px 0}header p{color:#c6cad7;margin:0}.wrap{max-width:960px;margin:24px auto;padding:0 18px 80px}.panel,.card{background:#fff;border:1px solid #e9e5dd;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #2927190a}.meta{color:#696b78;font-size:14px}h2{font-size:21px;margin:0 0 12px}h3{margin:4px 0 12px}button{background:#373f77;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:650}button.secondary{background:#edeefa;color:#313967}button:disabled{opacity:.55;cursor:default}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd0da;border-radius:9px;font:inherit;background:white}textarea{min-height:90px;resize:vertical}label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}img{max-width:100%;max-height:600px;object-fit:contain}audio{width:100%;max-width:500px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7}.row{display:flex;gap:10px;flex-wrap:wrap}.notice{padding:12px 14px;background:#fff2d7;border-radius:9px;line-height:1.6}.error{color:#a63131}.success{color:#157354}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.options .card{margin:0}.footer{font-size:13px;color:#747582;line-height:1.6} .hidden{display:none}
</style></head><body><header><small>MAIMAI / BLIND REVIEW</small><h1>麦麦盲测局</h1><p>先感受作品，再揭晓答案。</p></header><main class="wrap"><div id="message" class="panel">正在打开你的专属入口…</div><div id="app"></div><p class="footer">本页只展示本场活动。请勿转发个人链接；请勿在素材内容或元数据中写入会暴露身份的信息。</p></main>
<script>
'use strict';
const token=location.hash.slice(1), app=document.querySelector('#app'), msg=document.querySelector('#message');
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
function field(parent,label,element){parent.append(el('label',label),element);return element}
function notice(text,kind=''){msg.className='panel '+kind;msg.textContent=text}
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined,cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
function button(label,action,cls=''){const b=el('button',label,cls);b.onclick=async()=>{b.disabled=true;try{await action()}catch(e){notice(e.message,'error')}finally{b.disabled=false}};return b}
function imageOrAudio(card,item){if(item.kind==='text'){card.append(el('pre',item.text_value));return}const m=el(item.kind==='image'?'img':'audio');if(item.kind==='audio')m.controls=true;else m.alt='匿名作品';card.append(m);fetch('/api/media/'+encodeURIComponent(item.id),{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(r=>{if(!r.ok)throw Error('素材加载失败');return r.blob()}).then(b=>{m.src=URL.createObjectURL(b)}).catch(()=>card.append(el('p','素材加载失败','error')))}
async function load(){if(!token){notice('请使用麦麦私聊发送的个人链接。','error');return}const v=await api('/api/view');app.replaceChildren();notice(v.title+' · 活动 '+v.id+(v.parent?' · 复测关联 '+v.parent:''));const top=el('section',null,'panel');top.append(el('h2',v.role==='owner'?'主持人工作台':'你的独立评测'),el('p',v.state==='draft'?'准备中':v.state==='open'?'评测进行中':'已揭晓','meta'));app.append(top);
if(v.role==='owner'&&v.state==='draft'){
 top.append(el('p','上传作品并填写只在揭晓后公开的身份信息。开始后不可修改素材。','meta'));
 const kind=el('select');[['text','文字'],['image','图片'],['audio','短音频']].forEach(([a,b])=>{const o=el('option',b);o.value=a;kind.append(o)});field(top,'作品类型',kind);
 const identity=field(top,'揭晓信息（作者、模型或版本）',el('input'));identity.maxLength=200;
 const txt=field(top,'文字作品',el('textarea'));txt.maxLength=6000;
 const file=field(top,'图片或音频文件（最大 15 MB）',el('input'));file.type='file';file.accept='image/jpeg,image/png,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/webm';
 top.append(button('添加作品',async()=>{let data='',mime='';if(kind.value!=='text'){const f=file.files[0];if(!f||f.size>15*1024*1024)throw Error('请选择不超过 15 MB 的文件。');mime=f.type==='audio/x-wav'?'audio/wav':f.type;data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}await api('/api/add',{identity:identity.value,kind:kind.value,text:txt.value,mime,data});await load()}),el('span','  '),button('开始盲测',async()=>{await api('/api/start',{});await load()},'secondary'));
}
if(v.role==='owner'&&v.state==='open')top.append(el('p','群成员在原群发送 /盲测 参加 '+v.id+'，麦麦会私聊发送独立入口。','notice'),button('结束并揭晓',async()=>{await api('/api/reveal',{});await load()}));
if(v.items.length){const list=el('section',null,'options');v.items.forEach((item,i)=>{const c=el('article',null,'card');c.append(el('h3','作品 '+String.fromCharCode(65+i)));if(item.identity)c.append(el('p',item.identity,'meta'));imageOrAudio(c,item);if(v.role==='owner'&&v.state==='draft'){const identity=field(c,'修改揭晓信息',el('input'));identity.value=item.identity||'';identity.maxLength=200;let text=null;if(item.kind==='text'){text=field(c,'修改文字内容',el('textarea'));text.value=item.text_value;text.maxLength=6000}c.append(button('保存修改',async()=>{await api('/api/edit',{item_id:item.id,identity:identity.value,...(text?{text:text.value}:{})});await load()}));const confirm=el('label'),check=el('input');check.type='checkbox';check.style.width='auto';confirm.append(check,document.createTextNode(' 确认撤回此作品'));c.append(confirm,button('撤回作品',async()=>{if(!check.checked)throw Error('请先勾选确认撤回。');await api('/api/remove',{item_id:item.id});await load()},'secondary'));if(item.kind!=='text')c.append(el('p','更换图片或音频请先撤回，再上传新作品。','meta'))}list.append(c)});app.append(list)}
if(v.role==='reviewer'&&v.state==='open'&&!v.submitted){const form=el('section',null,'panel');form.append(el('h2','说说你的感受'),el('p','每个人的顺序不同；提交前看不到他人的选择。','meta'));const choose=()=>{let s=el('select');let blank=el('option','请选择');blank.value='';s.append(blank);v.items.forEach((x,i)=>{let o=el('option','作品 '+String.fromCharCode(65+i));o.value=x.id;s.append(o)});for(const [k,t] of [['equal','差不多'],['unknown','无法判断']]){let o=el('option',t);o.value=k;s.append(o)}return s};const natural=field(form,'更自然的是哪段？',choose()),fit=field(form,'更符合本次活动主题的是哪段？',choose());let comments={};v.items.forEach((x,i)=>{let t=el('textarea');t.placeholder='可选：哪里好，哪里还可以改？';t.maxLength=500;comments[x.id]=field(form,'作品 '+String.fromCharCode(65+i)+' 的意见',t)});form.append(button('提交我的评测',async()=>{let c={};Object.keys(comments).forEach(k=>c[k]=comments[k].value);await api('/api/vote',{choices:{natural:natural.value,fit:fit.value},comments:c});await load()}));app.append(form)}
if(v.submitted&&v.state==='open')app.append(el('section','已提交。揭晓前不会显示其他人的选择。','panel success'));
if(v.state==='revealed'){const res=await api('/api/results');const box=el('section',null,'panel');box.append(el('h2','揭晓与反馈'),el('p','共 '+res.count+' 份真实反馈；结果代表参与本场的人，不代表客观质量排名。','notice'));v.items.forEach((x,i)=>{const c=el('div',null,'card');c.append(el('h3','作品 '+String.fromCharCode(65+i)+' · '+x.identity),el('p','自然 '+res.counts.natural[x.id]+' 票 · 符合主题 '+res.counts.fit[x.id]+' 票','meta'));(res.feedback[x.id]||[]).forEach(t=>c.append(el('p','“'+t+'”')));box.append(c)});for(const [q,label] of [['natural','自然'],['fit','符合主题']])box.append(el('p',label+'：差不多 '+res.counts[q].equal+' · 无法判断 '+res.counts[q].unknown,'meta'));if(res.parent_summary){const p=res.parent_summary;box.append(el('h3','上一轮对照'),el('p',p.title+' · '+p.count+' 份反馈。两轮可能由不同的人参与，票数变化不等于作品质量变化。','notice'));p.items.forEach(x=>box.append(el('p',x.identity+'：自然 '+p.counts.natural[x.id]+' 票 · 符合主题 '+p.counts.fit[x.id]+' 票','meta')))}app.append(box)}
}
load().catch(e=>notice(e.message,'error'));
</script></body></html>
